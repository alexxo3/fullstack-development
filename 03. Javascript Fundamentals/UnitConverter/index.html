<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Unit Converter</title>
</head>
<body>
    <div id="input-container">
        <h1>Metric/Imperial Unit Converter</h1>
        <input type="number" id="input-el" placeholder="Enter a value">
        <button id="convert-btn">Convert</button>
    </div>
    <div id="output-container">
       <div class="units">
        <h2>Length (Meter/Feet)</h2>
        <p id="length-el">Enter a value to see conversions</p>
       </div>
       <div class="units">
        <h2>Volume (Liters/Gallons)</h2>
        <p id="volume-el">Enter a value to see conversions</p>
       </div>
       <div class="units">
        <h2>Mass (Kilograms/Pounds)</h2>
        <p id="mass-el">Enter a value to see conversions</p>
       </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
