<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <title>Password Generator</title>
</head>
<body>
    <div class="container">
        <h1>Generate a <span class="highlight">random password</span></h1>
        <p class="subtitle">Never use an insecure password again</p>

        <button class="gpw-btn" id="generate-btn">Generate Passwords</button>

        <div class="settings">
            <div class="setting">
                <label for="length-slider">Password Length: <span id="length-value">15</span></label>
                <input type="range" id="length-slider" min="8" max="32" value="15">
            </div>
            <div class="setting">
                <input type="checkbox" id="include-uppercase" checked>
                <label for="include-uppercase">Include Uppercase (A-Z)</label>
            </div>
            <div class="setting">
                <input type="checkbox" id="include-lowercase" checked>
                <label for="include-lowercase">Include Lowercase (a-z)</label>
            </div>
            <div class="setting">
                <input type="checkbox" id="include-numbers" checked>
                <label for="include-numbers">Include Numbers (0-9)</label>
            </div>
            <div class="setting">
                <input type="checkbox" id="include-symbols" checked>
                <label for="include-symbols">Include Symbols (!-$)</label>
            </div>
        </div>

        <hr>

        <div class="password-container">
            <div class="password-display">
                <span id="pw-1"></span>
                <button class="copy-btn" data-target="pw-1" title="Copy to clipboard">📋</button>
            </div>
            <div class="password-display">
                <span id="pw-2"></span>
                <button class="copy-btn" data-target="pw-2" title="Copy to clipboard">📋</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
